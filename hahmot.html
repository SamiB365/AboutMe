    <script>
      (function () {
        // Käännösrakenne: lisää tänne uudet avaimet + kielet.
        // Käytä HTML:ssä data-i18n="avain" niin teksti vaihtuu automaattisesti,
        // data-i18n-placeholder="avain" vaihtaa input-placeholderin.
        const I18N = {
          fi: {
            "nav.kartta": "Kartta",
            "nav.hahmot": "Hahmot",
            "nav.sarjakuva": "Sarjakuva",
            "nav.tietoa": "Tietoa",
            "nav.demo": "Pelaa demoa",
            "characters.title": "Hahmot",
            "carousel.prev": "Edellinen hahmo",
            "carousel.next": "Seuraava hahmo",
          },
          en: {
            "nav.kartta": "Map",
            "nav.hahmot": "Characters",
            "nav.sarjakuva": "Comic",
            "nav.tietoa": "About",
            "nav.demo": "Play demo",
            "characters.title": "Characters",
            "carousel.prev": "Previous character",
            "carousel.next": "Next character",
          },
        };

        const STORAGE_KEY = "duobotit-lang";
        const btns = Array.from(document.querySelectorAll(".lang-btn"));

        function applyLang(lang) {
          if (!I18N[lang]) lang = "fi";
          const dict = I18N[lang];
          const fallback = I18N.fi;

          // Vaihda tekstit; tyhjä/EN-placeholder kaatuu takaisin suomeen ettei sisältö katoa.
          document.querySelectorAll("[data-i18n]").forEach((el) => {
            const key = el.getAttribute("data-i18n");
            const val = dict[key];
            el.textContent = val || fallback[key] || el.textContent;
          });
          document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
            const key = el.getAttribute("data-i18n-placeholder");
            const val = dict[key];
            el.setAttribute("placeholder", val || fallback[key] || el.getAttribute("placeholder"));
          });
          document.querySelectorAll("[data-i18n-aria]").forEach((el) => {
            const key = el.getAttribute("data-i18n-aria");
            const val = dict[key];
            el.setAttribute("aria-label", val || fallback[key] || el.getAttribute("aria-label"));
          });

          btns.forEach((b) => {
            const on = b.dataset.lang === lang;
            b.classList.toggle("is-active", on);
            b.setAttribute("aria-pressed", on ? "true" : "false");
          });

          document.documentElement.lang = lang;
          try { localStorage.setItem(STORAGE_KEY, lang); } catch (_) {}
        }

        btns.forEach((b) => b.addEventListener("click", () => applyLang(b.dataset.lang)));

        let saved = "fi";
        try { saved = localStorage.getItem(STORAGE_KEY) || "fi"; } catch (_) {}
        applyLang(saved);
      })();
    </script>

    <!-- ====== HAHMOKARUSELLI: nuolet + klikkaus valitsevat kortin keskelle,
         pyörii ympyrää siihen suuntaan johon käyttäjä painaa (FLIP-animaatio +
         haamukortit reunoilla, ks. alempi selitys) ====== -->
    <script>
      (function () {
        const cards = Array.from(document.querySelectorAll(".char-card[data-index]"));
        const ghostPrev = document.getElementById("ghostPrev");
        const ghostNext = document.getElementById("ghostNext");
        const nameEl = document.getElementById("characterInfoName");
        const descEl = document.getElementById("characterInfoDesc");
        const prevBtn = document.getElementById("carouselPrev");
        const nextBtn = document.getElementById("carouselNext");
        if (!cards.length || !nameEl || !descEl) return;

        const total = cards.length;
        const TRANSITION_MS = 900; // vastaa .char-card:in transform-transitionin kestoa (styles.css) - yhden slotin kesto/käyrä
        let centerIndex = 2; // aloitus: keskimmäinen kortti (sama kuin aiempi kiinteä asettelu)
        let animating = false; // estää päällekkäiset kiertoanimaatiot haamujen kanssa

        function currentLang() {
          return document.documentElement.lang === "en" ? "en" : "fi";
        }

        function updateInfo() {
          const card = cards[centerIndex];
          const lang = currentLang();
          nameEl.textContent = card.dataset[lang === "en" ? "nameEn" : "nameFi"] || "";
          descEl.textContent = card.dataset[lang === "en" ? "descEn" : "descFi"] || "";
        }

        function slotFor(i) {
          // muuntaa kortin indeksin suhteelliseksi paikaksi keskikortista (-2..2), ympyrän muotoisesti
          return (((i - centerIndex + 2) % total) + total) % total - 2;
        }

        function applySlots() {
          cards.forEach((card, i) => {
            const slot = slotFor(i);
            card.dataset.slot = slot;
            card.setAttribute("aria-current", slot === 0 ? "true" : "false");
          });
        }

        // Lukee elementin SENHETKISEN CSS-transformin pystysiirtymän (--wave-y:n
        // vaikutus, translateY-komponentti) matrix()-merkkijonosta. Tarvitaan FLIP-
        // jäädytyksessä: kun JS korvaa koko transformin (translate(dx,dy)) väliaikaisesti,
        // --wave-y:n vaikutus katoaisi muuten kokonaan (kortit litistyisivät samalle
        // riville kesken siirtymän) - lisäämällä tämä dy:hen säilyy aaltomuodon
        // korkeusero koko animaation ajan. EI käytetä custom property -pohjaista
        // transformin yhdistämistä (translate(var(--a)) translateY(var(--b))) - todettu
        // epäluotettavaksi (selain ei aina animoinut, hyppäsi suoraan lopputilaan).
        function getWaveY(el) {
          const t = getComputedStyle(el).transform;
          if (!t || t === "none") return 0;
          const m = t.match(/^matrix\(([^)]+)\)$/);
          if (!m) return 0;
          const parts = m[1].split(",").map(Number);
          return parts[5] || 0; // matrix(a,b,c,d,e,f) -> f on y-siirtymä
        }

        function render(animate, direction, onDone) {
          if (!animate) {
            applySlots();
            updateInfo();
            if (onDone) onDone();
            return;
          }

          // FLIP: tallenna vanhat sijainnit + slotit, päivitä paikat, ja animoi ero sulavasti.
          //
          // Kun kortti kiertyy reunasta toiseen (esim. vasemmasta laidasta oikeaan laitaan),
          // sitä EI liu'uteta näkyvästi koko rivin yli. Sen sijaan:
          //  1) oikea kortti ("wrapCard") liukuu pois näkyvistä SAMAAN suuntaan mistä se tulikin
          //     (esim. vasemmalle ulos), samalla 900ms-tahdilla kuin muutkin kortit - EI hypi
          //     suoraan lopulliseen (vastakkaisen laidan) paikkaansa, koska se näkyisi rumana
          //     koko rivin ylittävänä liu'utuksena.
          //  2) pysyvästi reunalla piilossa oleva "haamukortti" (ghostPrev/ghostNext) liukuu
          //     samalla YHDEN slotin verran näkyvään reunapaikkaan (esim. 3 -> 2) - TÄMÄ on se
          //     mikä käyttäjä NÄKEE saapuvan, ei itse wrapCard.
          //  3) kun liike on valmis (900ms), wrapCard hypätään huomaamattomasti (ilman transitionia)
          //     haamun juuri jättämään näkyvään paikkaan, ja haamu palautetaan piiloon - koska
          //     kumpikin on juuri sillä hetkellä pikselintarkasti samassa kohdassa, vaihto ei näy.
          //
          // TÄRKEÄ CSS-OPETUS: kaksi flex-lasta EIVÄT mene päällekkäin vaikka niillä olisi sama
          // "paikkojen määrä ennen niitä" (esim. wrapCard suoraan ennen haamua VS haamu ennen
          // wrapCardia) - JÄRJESTYS vaikuttaa vain SIIHEN MIKÄ elementti on millä rankilla, ei
          // rankien MÄÄRÄÄN. Siksi wrapCard pitää "pysäköidä" väliaikaisesti TOISELLE PUOLELLE
          // (haamun lepopaikan ohi, esim. slot +4 kun haamu tulee oikealta) sen ajaksi kun se ei
          // ole näkyvissä - MUUTEN se laskisi mukaan "ennen keskikortteja" olevien korttien
          // määrään eivätkä muut kortit siirtyisi visuaalisesti ollenkaan (todettu bugi).
          const prevSlots = new Map(cards.map((c) => [c, Number(c.dataset.slot || 0)]));
          const oldRects = cards.map((c) => c.getBoundingClientRect());

          applySlots();

          let wrapCard = null;
          let wrapIndex = -1;
          let ghost = null;
          let ghostRestSlot = null;
          let ghostEnterSlot = null;
          let ghostOldRect = null;
          let exitRect = null; // wrapCardin visuaalinen (EI todellinen) poistumissijainti

          if (direction) {
            cards.forEach((card, i) => {
              const oldSlot = prevSlots.get(card);
              const naiveSlot = oldSlot - direction;
              if (naiveSlot < -2 || naiveSlot > 2) {
                wrapCard = card;
                wrapIndex = i;
              }
            });

            if (wrapCard) {
              ghost = direction > 0 ? ghostNext : ghostPrev;
              ghostRestSlot = direction > 0 ? 3 : -3; // haamun pysyvä piilopaikka
              ghostEnterSlot = direction > 0 ? 2 : -2; // slotti johon haamu liukuu näkyviin
              ghost.dataset.slot = ghostRestSlot; // varmista aloitusasema ennen mittausta
              ghostOldRect = ghost.getBoundingClientRect();

              // mittaa pelkkä VISUAALINEN poistumissijainti (samalle puolelle mistä kortti tuli) -
              // tätä ei jätetä pysyväksi slotiksi, vain hetkellinen mittaus dx/dy:tä varten
              const exitSlot = direction > 0 ? -4 : 4;
              wrapCard.dataset.slot = exitSlot;
              exitRect = wrapCard.getBoundingClientRect();

              // TODELLINEN väliaikainen "pysäköintipaikka" kiertymisen ajaksi: TOISELLA laidalla,
              // haamun lepopaikan (±3) OHI (±4) - näin se ei ole enää "ennen" keskikortteja
              // order-järjestyksessä eikä siis riko niiden siirtymälaskentaa
              wrapCard.dataset.slot = direction > 0 ? 4 : -4;
            }
          }

          const newRects = cards.map((c) => c.getBoundingClientRect());
          // --wave-y:n vaikutus (translateY-komponentti) kunkin kortin UUDESSA slotissa,
          // luettuna ENNEN kuin mikään inline-transform korvaa sen - ks. getWaveY().
          const newWaveY = cards.map((c) => getWaveY(c));
          let ghostNewRect = null;
          let ghostNewWaveY = 0;
          if (ghost) {
            ghost.dataset.slot = ghostEnterSlot;
            ghostNewRect = ghost.getBoundingClientRect();
            ghostNewWaveY = getWaveY(ghost);
          }

          // jäädytä kaikki (kortit + mahdollinen haamu) vanhaan visuaaliseen sijaintiinsa.
          // dy:hen lisätään newWaveY[i] koska asetettava transform KORVAA koko CSS-
          // transformin (myös --wave-y:n translateY:n) - ilman tätä lisäystä kortit
          // litistyisivät hetkeksi samalle riville (aaltomuoto katoaisi jäädytyksen ajaksi).
          cards.forEach((card, i) => {
            const dx = oldRects[i].left - newRects[i].left;
            const dy = oldRects[i].top - newRects[i].top + newWaveY[i];
            card.style.transition = "none";
            card.style.transform = `translate(${dx}px, ${dy}px)`;
          });
          if (ghost) {
            const gdx = ghostOldRect.left - ghostNewRect.left;
            const gdy = ghostOldRect.top - ghostNewRect.top + ghostNewWaveY;
            ghost.style.transition = "none";
            ghost.style.transform = `translate(${gdx}px, ${gdy}px)`;
          }

          void cards[0].offsetHeight; // pakota reflow ennen transitionin palautusta

          // wrapCardin oma liu'utuksen MAALI ei ole "" (todellinen pysäköintipaikka, joka olisi
          // väärällä puolella) vaan aiemmin mitattu exitRect (sama suunta mistä kortti tulikin).
          // Lisätään newWaveY[wrapIndex] (pysäköintislotin oma wave-y) samasta syystä kuin yllä.
          let exitDx = 0;
          let exitDy = 0;
          if (wrapCard) {
            exitDx = exitRect.left - newRects[wrapIndex].left;
            exitDy = exitRect.top - newRects[wrapIndex].top + newWaveY[wrapIndex];
          }

          requestAnimationFrame(() => {
            cards.forEach((card, i) => {
              if (card === wrapCard) {
                card.style.transition = "";
                card.style.transform = `translate(${exitDx}px, ${exitDy}px)`;
                return;
              }
              card.style.transition = "";
              card.style.transform = "";
            });
            if (ghost) {
              ghost.style.transition = "";
              ghost.style.transform = "";
            }
          });

          if (wrapCard) {
            // odota kunnes liu'utusanimaatio on valmis, ja tee huomaamaton vaihto: wrapCard
            // (joka on nyt piilossa exitRect:in kohdalla) hypätään lopulliseen näkyvään
            // slottiinsa (sama kohta missä haamu juuri oli), ja haamu palautetaan piiloon
            setTimeout(() => {
              wrapCard.style.transition = "none";
              wrapCard.dataset.slot = ghostEnterSlot;
              ghost.style.transition = "none";
              ghost.dataset.slot = ghostRestSlot;
              wrapCard.style.transform = "";
              void wrapCard.offsetHeight;
              requestAnimationFrame(() => {
                wrapCard.style.transition = "";
                ghost.style.transition = "";
                if (onDone) onDone();
              });
            }, TRANSITION_MS);
          } else {
            // ei kiertymistä: odota silti TRANSITION_MS verran ennen onDone-kutsua, jotta
            // peräkkäiset askeleet (esim. korttia klikatessa, ks. selectCard) tahdistuvat samaan
            // rytmiin kuin nuolella kiertäminen - ei hypitä seuraavaan askeleeseen ennen kuin
            // edellinen siirtymä on visuaalisesti valmis.
            setTimeout(() => {
              if (onDone) onDone();
            }, TRANSITION_MS);
          }

          updateInfo();
        }

        function rotate(direction) {
          if (animating) return;
          animating = true;
          centerIndex = ((centerIndex + direction) % total + total) % total;
          render(true, direction, () => {
            animating = false;
          });
        }

        function selectCard(i) {
          if (animating || i === centerIndex) return;
          // Klikkaus siirtää karusellin VAIN jos klikattu kortti on JOMPI KUMPI keskikortin
          // VÄLITTÖMÄSTI VIEREINEN kortti (yksi slotti kummallakin puolella) - kauempana olevat
          // (uloimmat) kortit eivät tee mitään klikattaessa (käyttäjän pyyntö: ei ketjutettua
          // usean slotin hyppyä klikkauksella, vain nuolinäppäimet liikkuvat useamman slotin).
          const forward = ((i - centerIndex) % total + total) % total;
          const backward = total - forward;
          if (forward !== 1 && backward !== 1) return;
          const direction = forward === 1 ? 1 : -1;
          animating = true;
          centerIndex = ((centerIndex + direction) % total + total) % total;
          render(true, direction, () => {
            animating = false;
          });
        }

        prevBtn?.addEventListener("click", () => rotate(-1));
        nextBtn?.addEventListener("click", () => rotate(1));

        cards.forEach((card, i) => {
          card.addEventListener("click", () => selectCard(i));
          card.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              selectCard(i);
            }
          });
        });

        render(false);
      })();
    </script>
  </body>
</html>
