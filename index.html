    <script>
      (function () {
        var overlay = document.getElementById("pageLoader");
        if (!overlay) return;
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          overlay.classList.add("reduced");
        }
        var MIN_MS = 500;   // näkyy vähintään tämän verran ettei feidaus välähdä
        var FORCE_MS = 10000; // turvaverkko jos 'load' ei jostain syystä laukea
        var start = Date.now();
        var done = false;
        function hide() {
          if (done) return;
          done = true;
          overlay.classList.add("hidden");
          overlay.setAttribute("aria-busy", "false");
          window.setTimeout(function () { overlay.remove(); }, 550);
        }
        function ready() {
          window.setTimeout(hide, Math.max(0, MIN_MS - (Date.now() - start)));
        }
        if (document.readyState === "complete") ready();
        else window.addEventListener("load", ready);
        window.setTimeout(hide, FORCE_MS);
      })();
    </script>

    <!-- ====== KIELIVAIHTO (FI/EN) ====== -->
    <script>
      (function () {
        // Käännösrakenne: lisää tänne uudet avaimet + kielet.
        // Käytä HTML:ssä data-i18n="avain" niin teksti vaihtuu automaattisesti,
        // data-i18n-placeholder="avain" vaihtaa input-placeholderin.
        const I18N = {
          fi: {
            "nav.kartta": "Kartta",
            "nav.hahmot": "Hahmot",
            "nav.sarjakuva": "Sarjakuva",
            "nav.tietoa": "Tietoa",
            "nav.demo": "Play demo",
            "hero.subtitle": "Lue sarjakuvaa, tutki maailmaa, pelaa peliä.",
          },
          en: {
            "nav.kartta": "Map",
            "nav.hahmot": "Characters",
            "nav.sarjakuva": "Comic",
            "nav.tietoa": "About",
            "nav.demo": "Play demo",
            "hero.subtitle": "Read the comic, explore the world, play the game.",
          },
        };

        const STORAGE_KEY = "duobotit-lang";
        const btns = Array.from(document.querySelectorAll(".lang-btn"));

        function applyLang(lang) {
          if (!I18N[lang]) lang = "fi";
          const dict = I18N[lang];
          const fallback = I18N.fi;

          // Vaihda tekstit; tyhjä/EN-placeholder kaatuu takaisin suomeen ettei sisältö katoa.
          document.querySelectorAll("[data-i18n]").forEach((el) => {
            const key = el.getAttribute("data-i18n");
            const val = dict[key];
            el.textContent = val || fallback[key] || el.textContent;
          });
          document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
            const key = el.getAttribute("data-i18n-placeholder");
            const val = dict[key];
            el.setAttribute("placeholder", val || fallback[key] || el.getAttribute("placeholder"));
          });

          btns.forEach((b) => {
            const on = b.dataset.lang === lang;
            b.classList.toggle("is-active", on);
            b.setAttribute("aria-pressed", on ? "true" : "false");
          });

          document.documentElement.lang = lang;
          try { localStorage.setItem(STORAGE_KEY, lang); } catch (_) {}
        }

        btns.forEach((b) => b.addEventListener("click", () => applyLang(b.dataset.lang)));

        let saved = "fi";
        try { saved = localStorage.getItem(STORAGE_KEY) || "fi"; } catch (_) {}
        applyLang(saved);
      })();
    </script>

    <!-- ====== MOBIILIN HAMPURILAISVALIKKO ====== -->
    <script>
      (function () {
        const btn = document.getElementById("hamburgerBtn");
        const menu = document.getElementById("mobileMenu");
        if (!btn || !menu) return;
        function setOpen(open) {
          menu.classList.toggle("is-open", open);
          btn.classList.toggle("is-open", open);
          btn.setAttribute("aria-expanded", open ? "true" : "false");
        }
        btn.addEventListener("click", () => setOpen(!menu.classList.contains("is-open")));
        menu.querySelectorAll("a").forEach((a) => a.addEventListener("click", () => setOpen(false)));
        document.addEventListener("keydown", (e) => { if (e.key === "Escape") setOpen(false); });
        document.addEventListener("click", (e) => {
          if (!menu.classList.contains("is-open")) return;
          if (menu.contains(e.target) || btn.contains(e.target)) return;
          setOpen(false);
        });
      })();
    </script>

    <!-- ====== NAVBAR-LOGON ANIMAATIO (hover CSS, click "imeytyy itseensä") ====== -->
    <script>
      (function () {
        const logo = document.querySelector(".brand-text-logo");
        const img = logo && logo.querySelector("img");
        if (!logo || !img) return;
        logo.addEventListener("click", (e) => {
          if (img.classList.contains("is-sucking")) return;
          e.preventDefault();
          img.classList.add("is-sucking");
          // avaa etusivu hieman ennen animaation loppua (animaatio 500ms)
          setTimeout(() => { window.location.href = logo.getAttribute("href"); }, 250);
        });
      })();
    </script>

    <!-- ====== ROBOTIN SPRITE-ANIMAATIO (jaettu frame-player.js) ====== -->
    <script type="module">
      import { framePlayer } from "./frame-player.js";

      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const introEl = document.getElementById("intro");
      const introBtn = document.getElementById("introBtn");
      const introFrame = document.getElementById("introFrame");

      let revealed = false;
      function revealHome() {
        if (revealed) return;
        revealed = true;
        introPlayer.stop();
        introEl.setAttribute("hidden", "");
        document.body.classList.add("entered");
      }

      // Aloitusanimaatio soitetaan kerran ("intro"-tila); kun se päättyy, etusivu paljastuu
      // automaattisesti. Klikkaus ennen loppua ohittaa animaation ja paljastaa etusivun heti.
      const introPlayer = framePlayer(introFrame, {
        onStateEnd: (name) => { if (name === "intro") revealHome(); },
      });
      introBtn.addEventListener("click", revealHome);

      if (reduce) {
        introPlayer.static();
        revealHome();
      } else {
        introPlayer.start();
      }

      // Logon klikkaus toistaa aloitusanimaation UUDESTAAN, vaikka ollaan jo etusivulla.
      // HUOM: pelkkä <a href="index.html">-linkki EI luotettavasti lataa sivua uudelleen kun
      // nykyinen URL eroaa vain ankkurista (esim. "index.html#tietoa" -> "index.html") -
      // selain käsittelee tätä pelkkänä "hyppää ankkuriin" -siirtymänä ilman uudelleenlatausta,
      // jolloin animaatio ei toistuisi. Siksi klikkaus estetään (preventDefault) ja
      // aloitusanimaatio käynnistetään suoraan JS:llä sen sijaan että luotettaisiin navigointiin.
      document.querySelectorAll("a.brand, a.brand-name").forEach((link) => {
        link.addEventListener("click", (e) => {
          e.preventDefault();
          revealed = false;
          document.body.classList.remove("entered");
          introEl.removeAttribute("hidden");
          if (reduce) {
            introPlayer.static();
            revealHome();
          } else {
            introPlayer.start();
          }
        });
      });
    </script>
