<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Duobotit</title>
    <meta name="description" content="Duobotit – tekninen tuki, ohjelmistokehitys, pelit ja sarjakuva." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Caveat:wght@700&family=Space+Mono:wght@400;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />

    <!-- Three.js (CDN, ESM importmap) – ei buildiä -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>

  <body>
    <!-- ====== WEBGL-NÄKYMÄ (3D-karuselli) ====== -->
    <canvas id="gl" aria-label="3D-näkymä"></canvas>

    <!-- ====== LATAUS ====== -->
    <div class="loader" id="loader">
      <div class="loader-logo">Duobotit</div>
      <div class="loader-bar"><i id="loaderFill"></i></div>
      <span class="loader-text">ladataan…</span>
    </div>

    <!-- ====== INTRO-PORTTI (robotti) ====== -->
    <div class="intro" id="intro" hidden>
      <button class="intro-btn" id="introBtn" type="button" aria-label="Avaa sivusto">
        <img id="introFrame" class="intro-frame" alt="" />
        <span class="intro-hint">click me</span>
      </button>
    </div>

    <!-- ====== UI-OVERLAY ====== -->
    <div class="brand" aria-hidden="true">Duobotit</div>
    <div class="ui" id="ui">
      <div class="card-label" id="cardLabel" aria-live="polite"></div>
      <div class="scroll-hint" id="scrollHint">scrollaa&nbsp;↕&nbsp;&middot;&nbsp;klikkaa korttia</div>
    </div>
    <footer class="credit" aria-hidden="true">© Duobotit — tekninen tuki · ohjelmistokehitys · pelit · sarjakuva</footer>

    <!-- ====== MODAALI: sarjakuvamaailma (DOM) ====== -->
    <div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-label="Kortin näkymä">
      <div class="modal-backdrop" data-close></div>
      <!-- Avautuva maailma (sarjakuva); sisältö rakennetaan app.js:ssä -->
      <section class="world" id="world" aria-label="Maailma"></section>
      <button class="modal-close" id="modalClose" type="button" aria-label="Sulje">×</button>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
