    <script>
      (function () {
        var overlay = document.getElementById("pageLoader");
        if (!overlay) return;
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          overlay.classList.add("reduced");
        }
        var MIN_MS = 500;    // näkyy vähintään tämän verran ettei feidaus välähdä
        var FORCE_MS = 10000; // turvaverkko jos load/duo:ready ei jostain syystä laukea
        var start = Date.now();
        var done = false;
        var pageLoaded = document.readyState === "complete";
        var appReady = window.__APP_READY === true;
        function hide() {
          if (done) return;
          done = true;
          overlay.classList.add("hidden");
          overlay.setAttribute("aria-busy", "false");
          window.setTimeout(function () { overlay.remove(); }, 550);
        }
        function tryReveal() {
          if (!pageLoaded || !appReady) return;
          window.setTimeout(hide, Math.max(0, MIN_MS - (Date.now() - start)));
        }
        window.addEventListener("load", function () { pageLoaded = true; tryReveal(); });
        // app.js kutsuu dispatchEvent("duo:ready") kun preload+3D-scene on valmis (myös virhetapauksessa
        // "duo:error" ettei kävijä jää jumiin loading-ruutuun).
        window.addEventListener("duo:ready", function () { appReady = true; tryReveal(); });
        window.addEventListener("duo:error", function () { appReady = true; tryReveal(); });
        window.setTimeout(hide, FORCE_MS);
        tryReveal();
      })();
    </script>

    <!-- ====== KIELIVAIHTO (FI/EN) ====== -->
    <script>
      (function () {
        // Käännösrakenne: lisää tänne uudet avaimet + kielet.
        // Käytä HTML:ssä data-i18n="avain" niin teksti vaihtuu automaattisesti.
        const I18N = {
          fi: {
            "nav.kartta": "Kartta",
            "nav.hahmot": "Hahmot",
            "nav.sarjakuva": "Sarjakuva",
            "nav.tietoa": "Tietoa",
            "nav.demo": "Play",
          },
          en: {
            "nav.kartta": "Map",
            "nav.hahmot": "Characters",
            "nav.sarjakuva": "Comic",
            "nav.tietoa": "About",
            "nav.demo": "Play",
          },
        };

        const STORAGE_KEY = "duobotit-lang";
        const btns = Array.from(document.querySelectorAll(".lang-btn"));

        function applyLang(lang) {
          if (!I18N[lang]) lang = "fi";
          const dict = I18N[lang];

          // Vaihda kaikkien merkittyjen elementtien tekstit.
          document.querySelectorAll("[data-i18n]").forEach((el) => {
            const key = el.getAttribute("data-i18n");
            if (dict[key] != null) el.textContent = dict[key];
          });

          // Korosta aktiivinen kielipainike.
          btns.forEach((b) => {
            const on = b.dataset.lang === lang;
            b.classList.toggle("is-active", on);
            b.setAttribute("aria-pressed", on ? "true" : "false");
          });

          document.documentElement.lang = lang;
          try { localStorage.setItem(STORAGE_KEY, lang); } catch (_) {}
        }

        btns.forEach((b) => b.addEventListener("click", () => applyLang(b.dataset.lang)));

        let saved = "fi";
        try { saved = localStorage.getItem(STORAGE_KEY) || "fi"; } catch (_) {}
        applyLang(saved);
      })();
    </script>

    <!-- ====== MOBIILIN HAMPURILAISVALIKKO ====== -->
    <script>
      (function () {
        const btn = document.getElementById("hamburgerBtn");
        const menu = document.getElementById("mobileMenu");
        if (!btn || !menu) return;
        function setOpen(open) {
          menu.classList.toggle("is-open", open);
          btn.classList.toggle("is-open", open);
          btn.setAttribute("aria-expanded", open ? "true" : "false");
        }
        btn.addEventListener("click", () => setOpen(!menu.classList.contains("is-open")));
        menu.querySelectorAll("a").forEach((a) => a.addEventListener("click", () => setOpen(false)));
        document.addEventListener("keydown", (e) => { if (e.key === "Escape") setOpen(false); });
        document.addEventListener("click", (e) => {
          if (!menu.classList.contains("is-open")) return;
          if (menu.contains(e.target) || btn.contains(e.target)) return;
          setOpen(false);
        });
      })();
    </script>

    <!-- ====== NAVBAR-LOGON ANIMAATIO (hover CSS, click "imeytyy itseensä") ====== -->
    <script>
      (function () {
        const logo = document.querySelector(".brand-text-logo");
        const img = logo && logo.querySelector("img");
        if (!logo || !img) return;
        logo.addEventListener("click", (e) => {
          if (img.classList.contains("is-sucking")) return;
          e.preventDefault();
          img.classList.add("is-sucking");
          // avaa etusivu hieman ennen animaation loppua (animaatio 500ms)
          setTimeout(() => { window.location.href = logo.getAttribute("href"); }, 250);
        });
      })();
    </script>
